<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Certificate Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <h1>Digital Certificate Portal</h1>
    <div class="nav-controls">
      <button id="theme-toggle" class="btn btn-alt" type="button">☀️ Light Mode</button>
      <button id="logout-btn" class="btn btn-danger hidden" type="button">Logout</button>
    </div>
  </header>

  <main class="content">

    <section id="login-container" class="card login-box" style="max-width: 420px; margin: 4rem auto;">
      <h2>Admin Authentication</h2>
      <p style="color: #f7f7f7; font-size: 0.9rem; margin-bottom: 1.25rem;">
        Sign in to access certificate issuance, management tools, and instant verification pipelines.
      </p>

      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Sign In</button>
        <p id="login-error" class="error-msg" style="font-size: 0.85rem; margin-top: 0.5rem;"></p>
      </form>
    </section>

    <section id="app-container" class="hidden">

      <div class="dashboard-grid" style="margin-bottom: 2rem;">

        <div class="card verify-box">
          <h2>Verify Certificate</h2>

          <form id="verify-form">
            <div class="input-group">
              <label for="verify-cert-id">Certificate ID</label>
              <input type="text" id="verify-cert-id" placeholder="e.g. CERT-ABC123XYZ" required>
            </div>

            <button type="submit" class="btn btn-primary">Verify Now</button>
          </form>

          <div id="verify-result"></div>
        </div>

        <div class="card upload-box">
          <h2>Upload New Certificate</h2>

          <form id="upload-form">
            <div class="input-group">
              <label for="cert-title">Certificate Title</label>
              <input type="text" id="cert-title" placeholder="e.g. Full-Stack Engineering" required>
            </div>

            <div class="input-group">
              <label for="recipient">Recipient Name</label>
              <input type="text" id="recipient" placeholder="e.g. Jane Doe" required>
            </div>

            <div class="dashboard-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin: 0;">
              <div class="input-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="Software Development">Software Development</option>
                  <option value="Cloud Computing">Cloud Computing</option>
                  <option value="Cybersecurity">Cybersecurity</option>
                  <option value="Artificial Intelligence">Artificial Intelligence</option>
                  <option value="General">General</option>
                </select>
              </div>

              <div class="input-group">
                <label for="issue-date">Issue Date</label>
                <input type="date" id="issue-date" required>
              </div>
            </div>

            <div class="input-group" style="margin-top: 0.5rem;">
              <label for="pdf-file">PDF Document (Max 2MB)</label>
              <input type="file" id="pdf-file" accept="application/pdf" required>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">
              Publish Certificate
            </button>
          </form>

          <div id="upload-message" style="margin-top: 0.75rem;"></div>
        </div>

      </div>

      <div class="card">
        <h2>Issued Certificates Dashboard</h2>

        <div class="controls-toolbar">
          <input type="text" id="search-input" placeholder="Search by title, recipient, or ID...">

          <select id="filter-category">
            <option value="All">All Categories</option>
            <option value="Software Development">Software Development</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="General">General</option>
          </select>
        </div>

        <div id="cert-grid" class="cert-grid"></div>
      </div>

    </section>

  </main>

  <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem;">
    &copy; 2026 Choudhary Portal. Built for Enterprise Verification Systems.
  </footer>

  <script src="script.js"></script>
</body>
</html>
